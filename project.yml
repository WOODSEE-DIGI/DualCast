# DualCast — dual-display NDI screen capture + NDI switcher relay
# Regenerate the Xcode project after editing:  xcodegen generate
#
# Targets:
#   DualCast          (sender, runs on the coding Mac) — captures each display
#                      as an independent NDI source.
#   DualCastSwitcher  (relay, runs on the streaming Mac) — receives both
#                      sources and re-broadcasts the selected one as a
#                      single NDI output for Ecamm Live.

name: DualCast

options:
  bundleIdPrefix: com.woodseedigi
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3BMZ2ULZ54
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "4"
  configs:
    Release:
      # Distributable builds sign with Developer ID (Debug stays Apple Development).
      # Manual style + no provisioning profile: correct for an unsandboxed,
      # hardened-runtime Developer ID app.
      CODE_SIGN_IDENTITY: "Developer ID Application"
      CODE_SIGN_STYLE: Manual
      PROVISIONING_PROFILE_SPECIFIER: ""

targets:
  DualCast:
    type: application
    platform: macOS
    sources:
      - path: Sources/DualCast
      - path: Sources/Shared
      - path: Vendor
        buildPhase: none
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: DualCast
        CFBundleDisplayName: DualCast
        CFBundleIconFile: DualCast.icns
        CFBundlePackageType: APPL
        NSPrincipalClass: NSApplication
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "woodsee"
        NSCameraUsageDescription: "DualCast publishes your cameras as NDI sources on the local network."
        NSMicrophoneUsageDescription: "DualCast captures system audio and attaches it to the selected display stream."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.woodseedigi.DualCast
        PRODUCT_NAME: DualCast
        DEVELOPMENT_TEAM: 3BMZ2ULZ54
        CODE_SIGN_ENTITLEMENTS: "$(SRCROOT)/Resources/DualCast.entitlements"
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Vendor/NDI/DualCast-Bridging-Header.h"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/NDI/include"
          - "$(SRCROOT)/Sources/Shared"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/Vendor/NDI"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
    dependencies:
      - framework: Vendor/NDI/libndi.dylib
        embed: true
        codeSign: true

  DualCastCameraExtension:
    type: extensionkit-extension
    platform: macOS
    sources:
      - path: Sources/CameraExtension
      - path: Sources/Shared
      - path: Vendor
        buildPhase: none
    info:
      path: Resources/CameraExtensionInfo.plist
      properties:
        CFBundleName: DualCast Virtual Camera
        CFBundleDisplayName: DualCast Virtual Camera
        CFBundlePackageType: XPC!
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "woodsee"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.cmio.DPA.camera
          NSExtensionPrincipalClass: DualCastCameraExtension.CameraExtensionProviderSource
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.woodseedigi.DualCastSwitcher.CameraExtension
        PRODUCT_NAME: DualCastCameraExtension
        DEVELOPMENT_TEAM: 3BMZ2ULZ54
        CODE_SIGN_ENTITLEMENTS: "$(SRCROOT)/Resources/CameraExtension.entitlements"
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Vendor/NDI/DualCast-Bridging-Header.h"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/NDI/include"
          - "$(SRCROOT)/Sources/Shared"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/Vendor/NDI"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path"
          - "@executable_path/../../../../Frameworks"
    dependencies:
      - sdk: CoreMediaIO.framework
      - framework: Vendor/NDI/libndi.dylib
        embed: true
        codeSign: true

  DualCastSwitcher:
    type: application
    platform: macOS
    sources:
      - path: Sources/Switcher
      - path: Sources/Shared
      - path: scripts/install-audio-driver.sh
      - path: Vendor
        buildPhase: none
    info:
      path: Resources/SwitcherInfo.plist
      properties:
        CFBundleName: DualCast Switcher
        CFBundleDisplayName: DualCast Switcher
        CFBundleIconFile: DualCastSwitcher.icns
        CFBundleExecutable: DualCastSwitcher
        CFBundlePackageType: APPL
        NSPrincipalClass: NSApplication
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "woodsee"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.woodseedigi.DualCastSwitcher
        PRODUCT_NAME: DualCastSwitcher
        DEVELOPMENT_TEAM: 3BMZ2ULZ54
        CODE_SIGN_ENTITLEMENTS: "$(SRCROOT)/Resources/Switcher.entitlements"
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Vendor/NDI/DualCast-Bridging-Header.h"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/NDI/include"
          - "$(SRCROOT)/Sources/Shared"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/Vendor/NDI"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
    dependencies:
      - framework: Vendor/NDI/libndi.dylib
        embed: true
        codeSign: true
      - target: DualCastCameraExtension
        embed: true
      - target: DualCastAudioDriver
        embed: false
      - sdk: SystemExtensions.framework

  DualCastAudioDriver:
    type: bundle
    platform: macOS
    sources:
      - path: Sources/AudioDriver
      - path: Sources/Shared/DualCastAudioRingBuffer.c
    info:
      path: Resources/AudioDriverInfo.plist
      properties:
        CFBundleName: DualCast Audio
        CFBundleDisplayName: DualCast Audio
        CFBundlePackageType: BNDL
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "woodsee"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.woodseedigi.DualCastSwitcher.AudioDriver
        PRODUCT_NAME: DualCastAudioDriver
        DEVELOPMENT_TEAM: 3BMZ2ULZ54
        WRAPPER_EXTENSION: driver
        MACH_O_TYPE: mh_bundle
        INFOPLIST_FILE: "$(SRCROOT)/Resources/AudioDriverInfo.plist"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: "$(SRCROOT)/Resources/AudioDriver.entitlements"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Sources/AudioDriver"
          - "$(SRCROOT)/Sources/Shared"
        CLANG_MODULES_AUTOLINK: NO
        OTHER_LDFLAGS:
          - "-Wl,-exported_symbol,_AudioServerPlugInFactory"
    dependencies:
      - sdk: CoreAudio.framework
      - sdk: CoreFoundation.framework
